services:
  # Backend Web Service
  - type: web
    name: predictive-maintenance-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python scripts/generate_dataset.py && python scripts/train_model.py && python scripts/seed_database.py"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production

  # Frontend Static Site
  - type: web
    name: predictive-maintenance-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
